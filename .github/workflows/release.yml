name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # GitHub Releases に書き込むため
  packages: write   # (将来 docker などにも対応する場合)
  id-token: write   # OIDC が必要になった場合に備えて

jobs:
  goreleaser:
    name: GoReleaser
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0   # changelog 生成のため履歴を全部取得

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Homebrew tap への push 用 PAT
          # 設定方法は RELEASING.md を参照
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
