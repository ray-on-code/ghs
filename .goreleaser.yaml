# GoReleaser v2 configuration
# Docs: https://goreleaser.com
#
# ローカル検証: make release-snapshot
# 本番リリース : git tag vX.Y.Z && git push origin vX.Y.Z  (GitHub Actions 経由)

version: 2

project_name: ghs

before:
  hooks:
    - go mod tidy
    - go mod download

builds:
  - id: ghs
    main: .
    binary: ghs
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      # Windows on ARM はリリース対象外 (需要小)
      - goos: windows
        goarch: arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/ray-on-code/ghs/cmd.Version={{.Version}}

archives:
  - id: default
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE*
      - CONTRIBUTING.md

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
      - "^style:"
      - "Merge pull request"
      - "Merge branch"
  groups:
    - title: "🚀 Features"
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: "🐛 Bug Fixes"
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: "⚡ Performance"
      regexp: '^.*?perf(\(.+\))??!?:.+$'
      order: 2
    - title: "🛠 Refactor"
      regexp: '^.*?refactor(\(.+\))??!?:.+$'
      order: 3
    - title: "Others"
      order: 999

release:
  github:
    owner: ray-on-code
    name: ghs
  draft: false
  prerelease: auto
  mode: replace
  header: |
    ## ghs {{ .Tag }}

    `ghs` (GitHub Select) のリリースノート。
  footer: |
    ---

    **Full Changelog**: https://github.com/ray-on-code/ghs/compare/{{ .PreviousTag }}...{{ .Tag }}

# Homebrew Tap への自動 push
# 事前条件:
#   1. ray-on-code/homebrew-tap リポジトリが存在すること
#   2. HOMEBREW_TAP_TOKEN シークレットに、両リポジトリへの write 権限を持つ PAT を設定
brews:
  - name: ghs
    repository:
      owner: ray-on-code
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    commit_author:
      name: ghs-release-bot
      email: ghs-release-bot@users.noreply.github.com
    commit_msg_template: "chore(brew): bump ghs to {{ .Tag }}"
    homepage: "https://github.com/ray-on-code/ghs"
    description: "Interactive GitHub repository selector and cloner (ghq-style)"
    license: "MIT"
    directory: Formula
    install: |
      bin.install "ghs"
    test: |
      system "#{bin}/ghs", "version"
    dependencies:
      - name: git
      - name: gh
        type: optional
